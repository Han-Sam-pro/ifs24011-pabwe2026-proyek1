[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # Isi dengan alamat backend jika backend di-host terpisah (lihat README).
  # VITE_API_BASE_URL = "https://api.roamplan.example.com/api"

# Single Page Application (SPA) fallback untuk React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Proxy API requests to Delcom Open API to avoid CORS issues on Netlify
[[redirects]]
  from = "/api-proxy/*"
  to = "https://open-api.delcom.org/api/v1/:splat"
  status = 200
  force = true

# Single Page Application (SPA) fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
